name: Daily Brief

# Generate a fresh daily report and publish to GitHub Pages.
#
# Schedule: Beijing time 09:05 / 09:25 / 09:45 — three cron triggers
# (UTC 01:05 / 01:25 / 01:45) act as **redundant insurance** so the morning
# run still fires even if GitHub silently drops one or two of them.
# The "gate" job enforces **at most one build per day**:
#   - workflow_dispatch always runs;
#   - if another run of this workflow is still in progress, this trigger is
#     skipped outright ("前一次没跑完，下一次直接跳过") — checked via the
#     Actions API, because `concurrency` would QUEUE (delay) rather than skip;
#   - if today's report already exists on gh-pages, this trigger is skipped
#     (one build per day — the first successful morning run wins);
#   - filters by REPORT_DAYS (default: every day).

on:
  schedule:
    # Beijing 09:05 / 09:25 / 09:45 = UTC 01:05 / 01:25 / 01:45
    - cron: '5 * * * *'
    - cron: '35 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # needed to push to gh-pages branch

jobs:
  gate:
    name: Time & concurrency gate
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check schedule
        id: check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR }}
          REPORT_DAYS: ${{ vars.REPORT_DAYS }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Manual triggers always run — user clicked Run workflow.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — bypassing gate"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if a previous run of this workflow is still in progress.
          RUNNING=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/daily.yml/runs?status=in_progress&per_page=20" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(len([r for r in d.get('workflow_runs',[]) if r['id'] != ${RUN_ID}]))" 2>/dev/null || echo 0)
          echo "Other running runs of daily.yml: $RUNNING"
          if [ "$RUNNING" -gt 0 ]; then
            echo "→ Previous run still in progress — skipping this trigger"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TZ_VAL="${REPORT_TZ:-Asia/Shanghai}"
          HOURS_VAL="${REPORT_HOUR:-9}"
          DAYS_VAL="${REPORT_DAYS:-*}"

          NOW_HOUR=$(TZ="$TZ_VAL" date +%-H)
          NOW_DOW=$(TZ="$TZ_VAL" date +%w)
          NOW_PRINT=$(TZ="$TZ_VAL" date '+%Y-%m-%d %H:%M %Z')

          echo "Now in $TZ_VAL: $NOW_PRINT (hour=$NOW_HOUR, dow=$NOW_DOW)"
          echo "Configured REPORT_HOUR='$HOURS_VAL', REPORT_DAYS='$DAYS_VAL'"

          # Hour match: comma-separated list of integers (0-23).
          hour_match=false
          IFS=',' read -ra HLIST <<< "$HOURS_VAL"
          for h in "${HLIST[@]}"; do
            h_trim="${h// /}"
            if [ "$NOW_HOUR" = "$h_trim" ]; then
              hour_match=true
              break
            fi
          done

          # Day-of-week match: '*', single digits, ranges "a-b", or comma combos.
          day_match=false
          if [ "$DAYS_VAL" = "*" ]; then
            day_match=true
          else
            IFS=',' read -ra DLIST <<< "$DAYS_VAL"
            for d in "${DLIST[@]}"; do
              d_trim="${d// /}"
              if [[ "$d_trim" == *-* ]]; then
                start="${d_trim%-*}"
                end="${d_trim#*-}"
                if [ "$NOW_DOW" -ge "$start" ] && [ "$NOW_DOW" -le "$end" ]; then
                  day_match=true
                  break
                fi
              else
                if [ "$NOW_DOW" = "$d_trim" ]; then
                  day_match=true
                  break
                fi
              fi
            done
          fi

          # 每天最多构建一次：当日报告已发布到 gh-pages 则跳过本次触发。
          # （9:05/9:25/9:45 三个触发点互为保险——GitHub cron 会静默丢触发，
          # 多设几个确保至少一次命中；第一个成功跑的发布报告后，其余触发全部跳过。）
          # 并发跳过已在前面处理：前一次还在跑（in_progress）时本次直接跳过。
          if [ "$hour_match" = "true" ] && [ "$day_match" = "true" ]; then
            TODAY=$(TZ="$TZ_VAL" date +%Y-%m-%d)
            CHECK_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${TODAY}/${TODAY}.html?ref=gh-pages"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$CHECK_URL" || echo "000")
            if [ "$HTTP_CODE" = "404" ]; then
              echo "✓ Match & today's report missing — proceeding to build"
              echo "should-run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Today's report already exists (HTTP $HTTP_CODE) — skipping (one build per day)"
              echo "should-run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "✗ No match — skipping (hour=$hour_match day=$day_match)"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bring previous reports into the workspace so they survive each run
      # and so build-site can list them all in the archive.
      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            # Drop the index/archive — build-site regenerates them
            rm -f daily_reports/index.html daily_reports/archive.html
            restored=$(ls -1d daily_reports/20*/ 2>/dev/null | wc -l | tr -d ' ')
            echo "Restored ${restored} prior report dirs"
            # Guard against accidentally wiping published history: publish
            # uses keep_files:false, so if restore produced nothing the push
            # would delete every historical report. Abort instead.
            if [ "${restored}" -eq 0 ]; then
              echo "::error::gh-pages restore produced no report dirs — aborting to avoid wiping published history"
              exit 1
            fi
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      - name: Run local crawlers (exchange IPO)
        run: node scripts/crawlers/run-all.mjs
        continue-on-error: true

      # 广州商机源（统计局/市政府/南沙）。独立于 run-all.mjs，产出 data/crawled-gz.json，
      # 供 daily.ts 加载（否则报「广州商机数据文件不存在」）。
      - name: Run GZ crawlers
        run: node scripts/crawlers/run-gz.mjs
        continue-on-error: true

      # ---------- 检查数据文件，若不存在则创建空文件 ----------
      - name: Ensure data files exist
        run: |
          mkdir -p data
          for f in data/crawled-articles.json data/crawled-gz.json; do
            if [ ! -f "$f" ]; then
              echo "⚠️ $f 未生成，创建空文件"
              echo '[]' > "$f"
            else
              count=$(cat "$f" | jq '. | length' 2>/dev/null || echo 0)
              echo "✅ $f 存在，共 $count 条"
            fi
          done

      # ---------- 将爬虫数据保存为 Artifact（永久下载） ----------
      - name: Upload crawler data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawler-data
          path: |
            data/crawled-articles.json
            data/crawled-gz.json
          retention-days: 30   # 保留30天，可调整

      - name: Generate today's report
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # Optional proxy / self-hosted endpoints — forward whatever the
          # forker set in Settings → Variables. Empty values are a no-op
          # (backends fall back to the official URL in code).
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          ZHIPU_BASE_URL: ${{ vars.ZHIPU_BASE_URL }}
          # Generic aliases — handy when pointing at an OpenAI/Anthropic
          # compatible service that isn't one of the named presets (Moonshot,
          # SiliconFlow, OpenRouter, self-hosted, ...). Provider-specific
          # vars above take precedence when both are set.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          WEB_MODE: 'true'
        run: npm run dry-run

      # 每日流程会重写 data/article-history.json（含当日爬虫数据 + 被重新灌入的
      # 旧缓存，可能含陈旧日期）。先裁剪到最近 N 天（默认 7），被移除数据累积写入
      # data/article-history-backup.json（不丢弃），再一次性把两者提交回 main。
      # 注意：本步骤提交的是主分支上的文件，与下方发布到 gh-pages 的报告互不干扰。
      - name: Trim history to recent N days (keep backup)
        run: node scripts/cleanup-history.mjs

      - name: Commit rolling history + backup (article-history.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/article-history.json data/article-history-backup.json
          if git diff --cached --quiet; then
            echo "历史文件无变化，跳过提交"
          else
            git commit -m "chore: 更新当日文章历史缓存并裁剪到最近7天 ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Build static site (index + archive)
        run: npm run build-site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false  # we restored everything above, so a clean publish is fine
          commit_message: 'daily: report for ${{ github.run_id }}'

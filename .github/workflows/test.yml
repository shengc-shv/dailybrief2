name: Test Run (data package + render, no publish)

# 手动触发（workflow_dispatch only）：跑爬虫产出最新数据包 + 抓取全部信息源渲染验证。
# 与 daily.yml 逻辑一致，但：无自动触发、无 AI 调用、不推送静态页面。
# 产出 crawler-data artifact 供本地「预 AI 分析加载」任务拉回比对历史、识别新增条目。

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Ensure data files exist
        run: |
          mkdir -p data
          for f in data/crawled-articles.json data/crawled-gz.json; do
            if [ ! -f "$f" ]; then
              echo '[]' > "$f"
            fi
          done

      # 抓取最新爬虫数据包（交易所 IPO + 广州商机），上传为 crawler-data artifact，
      # 供本地「预 AI 分析加载」任务拉回比对：找出历史库中的新增条目 → AI 分析打标。
      - name: Run local crawlers (exchange IPO)
        run: node scripts/crawlers/run-all.mjs
        continue-on-error: true

      - name: Run GZ crawlers
        run: node scripts/crawlers/run-gz.mjs
        continue-on-error: true

      - name: Upload crawler data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawler-data
          path: |
            data/crawled-articles.json
            data/crawled-gz.json
          retention-days: 30

      # 抓取全部信息源（RSS/API/新浪/央视等，非 OFFLINE）+ 渲染验证。
      # dry-run 无 AI 调用（不生成/不消费 LLM）；仅更新 lastSeenAt 写回历史。
      - name: Fetch sources and render (no AI)
        env:
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          WEB_MODE: 'true'
        run: npm run dry-run

      # 回写滚动 30 天文章历史（当天/过去30天 的数据源）。每次 test 运行都更新
      # lastSeenAt，故通常会有 diff；仅在有变化时提交。本步骤已复制进 daily.yml。
      - name: Commit rolling history (article-history.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/article-history.json
          if git diff --cached --quiet; then
            echo "历史文件无变化，跳过提交"
          else
            git commit -m "chore: 更新当日文章历史缓存 ($(date -u +%Y-%m-%d))"
            git push
          fi

  # 每周刷新粤企注册表（企业名/股票/城市 单一真相源）。
  # 仅周一（北京时间）运行（手动触发 test.yml 时也会检查），重建 JSON 并在有变化时提交回 main；不发布任何报告。
  refresh-guangdong-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Weekly gate (only Monday, Asia/Shanghai)
        id: gw
        run: |
          DOW=$(TZ=Asia/Shanghai date +%u)   # 1=Monday
          if [ "$DOW" = "1" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gw.outputs.run == 'true'

      - name: Setup Node
        if: steps.gw.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh 粤企注册表 (EastMoney F10 复核省份)
        if: steps.gw.outputs.run == 'true'
        run: node scripts/seed-guangdong-registry.mjs

      - name: Commit updated registry (if changed)
        if: steps.gw.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/sources/guangdong-registry.json
          if git diff --cached --quiet; then
            echo "粤企注册表无变化，跳过提交"
          else
            git commit -m "chore: 每周刷新粤企注册表 ($(date -u +%Y-%m-%d))"
            git push
          fi

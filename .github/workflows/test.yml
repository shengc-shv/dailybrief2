name: Test Run (AI pre-fill, no publish)

on:
  workflow_dispatch:
  schedule:
    # 每日 07:30 北京时间（UTC 23:30）跑 AI 预填，赶在 daily.yml（默认 08:00 北京时间）之前，
    # 把当日/滚动文章分析好写进 data/article-history.json；daily.yml 走 dry-run 直接复用 → AI 成本≈0。
    # 若你改了 daily.yml 的 REPORT_HOUR，请把这里的 cron 同步提前到它之前。
    - cron: "30 23 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Ensure data file exists
        run: |
          mkdir -p data
          if [ ! -f data/crawled-articles.json ]; then
            echo '[]' > data/crawled-articles.json
          fi

      # 纯历史渲染验证：不访问任何网络源（OFFLINE），直接用本地数据文件
      # （crawled-articles.json / crawled-gz.json）+ 滚动历史缓存（article-history.json）
      # 渲染当日 HTML，验证渲染管线与源路由无回归。无 AI 调用。
      - name: Render from history (OFFLINE, no fetch)
        env:
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          WEB_MODE: 'true'
          OFFLINE: 'true'
        run: npm run dry-run

      - name: Upload HTML for preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-report
          path: daily_reports/

      # 回写滚动 30 天文章历史（当天/过去30天 的数据源）。每次 test 运行都更新
      # lastSeenAt，故通常会有 diff；仅在有变化时提交。本步骤已复制进 daily.yml。
      - name: Commit rolling history (article-history.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/article-history.json
          if git diff --cached --quiet; then
            echo "历史文件无变化，跳过提交"
          else
            git commit -m "chore: 更新当日文章历史缓存 ($(date -u +%Y-%m-%d))"
            git push
          fi

  # 每周刷新粤企注册表（企业名/股票/城市 单一真相源）。
  # 仅周一（北京时间）运行，重建 JSON 并在有变化时提交回 main；不发布任何报告。
  # 注意：本 job 跟随 test.yml 的每日 cron 触发，但用「周一(北京时间)」闸门限制为每周一次。
  refresh-guangdong-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Weekly gate (only Monday, Asia/Shanghai)
        id: gw
        run: |
          DOW=$(TZ=Asia/Shanghai date +%u)   # 1=Monday
          if [ "$DOW" = "1" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gw.outputs.run == 'true'

      - name: Setup Node
        if: steps.gw.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh 粤企注册表 (EastMoney F10 复核省份)
        if: steps.gw.outputs.run == 'true'
        run: node scripts/seed-guangdong-registry.mjs

      - name: Commit updated registry (if changed)
        if: steps.gw.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/sources/guangdong-registry.json
          if git diff --cached --quiet; then
            echo "粤企注册表无变化，跳过提交"
          else
            git commit -m "chore: 每周刷新粤企注册表 ($(date -u +%Y-%m-%d))"
            git push
          fi
